<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sargaaaaa ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div id="intro">
    <div class="heart">❤️</div>

    <h3>Someone has a surprise for you...</h3>

    <button id="openBtn">Tap To Open ✨</button>
</div>

<div id="main">

    <div class="stars"></div>

    <h1 class="title">I found her. 🤍</h1>

    <p class="subtitle">
        Among millions of people...
        <br>
        I found someone truly special.
    </p>

    <div class="gallery">
        <img src="images/photo1.jpg" class="slide active">
        <img src="images/photo2.jpg" class="slide">
        <img src="images/photo3.jpg" class="slide">
    </div>

    <div class="message">
        <h2>Happy Friendship Day 💖</h2>
        <h1>Sargaaaaa 😚</h1>
        <p>Forever Best Friends ♾️</p>
        <h3>From Bhoommmm 😌🤍</h3>
    </div>

    <div class="floating-hearts">
        <span>🤍</span>
        <span>💖</span>
        <span>💕</span>
        <span>✨</span>
        <span>💛</span>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
